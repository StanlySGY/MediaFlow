# MediaFlow Docker Compose 配置
# 使用前请确保已创建 .env 文件：cp .env.example .env

services:
  mediaflow:
    build: .
    image: mediaflow:latest
    container_name: mediaflow
    # 自动重启策略：除非手动停止，否则容器退出后自动重启
    restart: unless-stopped
    ports:
      # 映射端口：宿主机端口:容器端口
      - "8999:8999"
    # 从 .env 文件加载环境变量
    env_file:
      - .env
    volumes:
      # 临时文件目录挂载（音频切片等）
      - ./temp:/app/temp
      # 输出文件目录挂载（转写结果等）
      - ./outputs:/app/outputs
    # 健康检查：每 30 秒检测一次服务是否正常
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8999/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
