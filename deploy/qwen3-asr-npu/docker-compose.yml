# Qwen3-ASR NPU 部署配置
#
# 支持硬件：Ascend 910B / 310P
# 参考文档：https://docs.vllm.ai/projects/ascend/en/latest/tutorials/models/Qwen3-ASR-1.7B.html
#
# 使用前请确保：
# 1. 已安装 NPU 驱动（npu-smi info 可正常执行）
# 2. 模型文件已放置在 /home/models/Qwen3-ASR-1.7B/

services:
  qwen3-asr:
    image: quay.io/ascend/vllm-ascend:v0.22.1rc1
    container_name: qwen3-asr
    restart: unless-stopped
    ports:
      # vLLM 服务端口
      - "8022:8000"
    volumes:
      # 模型文件目录（宿主机路径:容器路径）
      - /home/models/Qwen3-ASR-1.7B:/data/models/Qwen3-ASR-1.7B
      # Ascend 驱动挂载
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info
      - /etc/ascend_install.info:/etc/ascend_install.info
      # 模型缓存目录（可选，用于在线下载模型）
      - /root/.cache:/root/.cache
    environment:
      - TZ=Asia/Shanghai
      # 指定 NPU 设备（0、1、2...根据 npu-smi info 结果修改）
      - ASCEND_RT_VISIBLE_DEVICES=0
    devices:
      # NPU 设备映射（数字需与 ASCEND_RT_VISIBLE_DEVICES 一致）
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
    # 共享内存（NPU 推理需要）
    shm_size: "1g"
    # 启动命令：使用 vLLM 提供 OpenAI 兼容接口
    command: >
      vllm serve /data/models/Qwen3-ASR-1.7B
      --served-model-name qwen3-asr
      --tensor-parallel-size 1
      --max-model-len 4096
      --gpu-memory-utilization 0.9
      --enforce-eager
      --port 8000

  # ---------------------------------------------------------------------------
  # 真正流式识别服务（边说边出字）
  #
  # 与上面的 qwen3-asr（vllm serve）区别：
  #   - qwen3-asr：OpenAI 兼容接口，只能收完整音频后返回；MediaFlow 端用
  #     realtime_offline “录完再识别”模拟流式。
  #   - streaming：包装 qwen-asr 的 streaming_transcribe() 增量 API，音频 chunk
  #     到达即解码识别、立即推送部分结果，是真正的流式。
  #
  # 重要：流式服务需要独占一张 NPU 卡，不能与上面的 vLLM 服务共用同一张卡。
  #       请为它分配不同的卡号（下面示例用卡 1）。
  #
  # MediaFlow 配置（服务配置 → 实时识别）：
  #   实时接口类型 = realtime_http
  #   实时接口地址 = http://<服务器IP>:8023
  streaming:
    build: ./streaming_server
    container_name: qwen3-asr-streaming
    restart: unless-stopped
    ports:
      # 流式服务端口（对外 8023 → 容器内 8001）
      - "8023:8001"
    volumes:
      # 模型文件目录（与 vLLM 服务共用同一份模型文件即可）
      - /home/models/Qwen3-ASR-1.7B:/data/models/Qwen3-ASR-1.7B
      # Ascend 驱动挂载
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info
      - /etc/ascend_install.info:/etc/ascend_install.info
      - /root/.cache:/root/.cache
    environment:
      - TZ=Asia/Shanghai
      # 独占一张与 vLLM 服务不同的 NPU 卡（此处示例用卡 1）
      - ASCEND_RT_VISIBLE_DEVICES=1
      - MODEL_DIR=/data/models/Qwen3-ASR-1.7B
      - GPU_MEMORY_UTILIZATION=0.9
      # 流式内部切块秒数：越小越“即时”，但推理更频繁
      - CHUNK_SIZE_SEC=2.0
    devices:
      # NPU 设备映射（数字需与 ASCEND_RT_VISIBLE_DEVICES 一致）
      - /dev/davinci1:/dev/davinci1
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
    shm_size: "1g"
