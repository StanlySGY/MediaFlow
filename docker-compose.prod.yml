# Production / air-gapped deployment — runs a pre-loaded image, never builds.
#
# Workflow (see README "离线现场部署"):
#   build host (online):  ./build.sh --save        → mediaflow-1.8.3-arm64.tar.gz
#   copy the .tar.gz to the air-gapped site
#   site (offline):       docker load -i mediaflow-1.8.3-arm64.tar.gz
#                         cp .env.example .env   # set ASR_BASE_URL to the in-network ASR
#                         docker compose -f docker-compose.prod.yml up -d
#
# No `build:` key on purpose: if the image isn't loaded, compose fails loudly
# ("image not found") instead of silently trying to build offline. The image
# tag is pinned so the running version is traceable across deliveries.
#
# Networking: host mode — MAAS/OpenStack & firewalld hosts drop traffic to the
# docker bridge, so host binding avoids forwarding. The sample .env binds to
# loopback; for remote access, set ACCESS_TOKENS before setting HOST=0.0.0.0.
#
# Permissions: the image runs as uid 10001 (not root). The three bind mounts
# below are created by the host and are normally owned by the host user, which
# uid 10001 cannot write to. One-time fix on the site host, before `up -d`:
#   mkdir -p temp outputs config && sudo chown -R 10001:10001 temp outputs config
# If they are not writable, the container refuses to start: startup names each
# path it cannot write, prints this exact command, and exits non-zero. A
# container that answers /health but dies on the first upload is worse off.
services:
  mediaflow:
    image: mediaflow:1.8.3
    container_name: mediaflow
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./temp:/app/temp
      - ./outputs:/app/outputs
      # 运行时配置（页面上保存的接入配置和密钥），重建容器后仍在
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:${PORT:-8999}/health',timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
